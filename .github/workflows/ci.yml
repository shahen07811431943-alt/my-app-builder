name: CI & Visual Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Ensure Next.js App Files Exist (Auto-Fix)
        run: |
          # إنشاء المجلد إذا لم يكن موجوداً
          mkdir -p apps/builder/app
          
          # إنشاء ملف layout.tsx إذا كان مفقوداً
          if [ ! -f apps/builder/app/layout.tsx ]; then
            echo "Creating layout.tsx..."
            cat > apps/builder/app/layout.tsx << 'EOF'
          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (
              <html lang="en">
                <body>{children}</body>
              </html>
            );
          }
          EOF
          fi

          # إنشاء ملف page.tsx إذا كان مفقوداً
          if [ ! -f apps/builder/app/page.tsx ]; then
            echo "Creating page.tsx..."
            cat > apps/builder/app/page.tsx << 'EOF'
          export default function Home() {
            return (
              <main style={{ padding: "40px", fontFamily: "sans-serif" }}>
                <h1 style={{ color: "blue" }}>App Builder Works!</h1>
                <p>This interface is running directly from GitHub Actions.</p>
              </main>
            );
          }
          EOF
          fi

      - name: Build Project
        run: pnpm build
          
      - name: Start Builder App & Expose URL
        run: |
          # تشغيل التطبيق في الخلفية
          pnpm --filter @repo/builder start & 
          sleep 5 
          
          # إنشاء رابط معاينة
          npx localtunnel --port 3000 > tunnel.txt &
          sleep 3
          
          TUNNEL_URL=$(grep -o 'https://.*' tunnel.txt)
          echo "================================================="
          echo "🔗 افتح هذا الرابط لرؤية الواجهة:"
          echo "$TUNNEL_URL"
          echo "================================================="
          
          # الانتظار لمدة 5 دقائق
          sleep 300
