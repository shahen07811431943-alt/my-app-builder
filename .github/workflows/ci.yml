name: CI & Visual Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Build Project
        # أمر البناء سيقوم بفحص الأكواد والتأكد من سلامتها تلقائياً
        run: pnpm build
          
      - name: Start Builder App & Expose URL
        run: |
          # تشغيل التطبيق في الخلفية
          pnpm --filter @repo/builder start & 
          sleep 5 
          
          # إنشاء رابط معاينة
          npx localtunnel --port 3000 > tunnel.txt &
          sleep 3
          
          TUNNEL_URL=$(grep -o 'https://.*' tunnel.txt)
          echo "================================================="
          echo "🔗 افتح هذا الرابط لرؤية الواجهة:"
          echo "$TUNNEL_URL"
          echo "================================================="
          
          # الانتظار لمدة 5 دقائق
          sleep 300
