name: CI & Visual Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # تم إزالة cache: "pnpm" مؤقتاً لتجنب خطأ عدم وجود ملف القفل
          
      - name: Install dependencies
        # استخدام --no-frozen-lockfile يسمح بالعمل حتى لو لم يكن ملف pnpm-lock.yaml موجوداً
        run: pnpm install --no-frozen-lockfile
        
      - name: Typecheck & Build
        run: |
          pnpm typecheck
          pnpm build
          
      - name: Start Builder App & Expose URL
        run: |
          pnpm --filter @repo/builder start & 
          sleep 5 
          npx localtunnel --port 3000 > tunnel.txt &
          sleep 3
          TUNNEL_URL=$(grep -o 'https://.*' tunnel.txt)
          echo "================================================="
          echo "🔗 افتح هذا الرابط لرؤية الواجهة:"
          echo "$TUNNEL_URL"
          echo "================================================="
          sleep 300
