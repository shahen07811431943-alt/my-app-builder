name: Scaffold Project Structure

on:
  workflow_dispatch: # تفعيل التشغيل اليدوي من تبويب Actions

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري للسماح بعمل commit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Old Structure & Create Folders
        run: |
          # مسح المجلدات والملفات القديمة (مع الحفاظ على .github و .git)
          echo "🧹 Deleting old structure..."
          rm -rf apps packages
          rm -f package.json pnpm-workspace.yaml turbo.json tsconfig.base.json .gitignore .npmrc .env.example
          
          # إنشاء المجلدات الجديدة
          echo "📁 Creating new directory structure..."
          mkdir -p apps/builder/app
          mkdir -p apps/client/app
          mkdir -p packages/core/src
          mkdir -p packages/ui/src

      - name: Generate All Project Files
        run: |
          # 1. package.json
          cat > package.json << 'EOF'
          {
            "name": "my-app-builder",
            "private": true,
            "scripts": {
              "build": "turbo run build",
              "dev": "turbo run dev",
              "lint": "turbo run lint",
              "typecheck": "turbo run typecheck",
              "format": "prettier --write \"**/*.{ts,tsx,md}\""
            },
            "devDependencies": {
              "prettier": "^3.4.2",
              "turbo": "^2.3.3",
              "typescript": "^5.7.2"
            },
            "packageManager": "pnpm@9.15.1",
            "engines": {
              "node": ">=20"
            }
          }
          EOF

          # 2. pnpm-workspace.yaml
          cat > pnpm-workspace.yaml << 'EOF'
          packages:
            - "apps/*"
            - "packages/*"
          EOF

          # 3. turbo.json
          cat > turbo.json << 'EOF'
          {
            "$schema": "https://turborepo.dev/schema.json",
            "tasks": {
              "build": {
                "dependsOn": ["^build"],
                "outputs": [".next/**", "!.next/cache/**", "dist/**"]
              },
              "dev": {
                "cache": false,
                "persistent": true
              },
              "lint": {},
              "typecheck": {
                "dependsOn": ["^typecheck"]
              }
            }
          }
          EOF

          # 4. tsconfig.base.json
          cat > tsconfig.base.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "esModuleInterop": true,
              "strict": true,
              "skipLibCheck": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "jsx": "preserve"
            }
          }
          EOF

          # 5. .gitignore
          cat > .gitignore << 'EOF'
          node_modules/
          .next/
          dist/
          .turbo/
          .env
          .env.local
          *.log
          .DS_Store
          EOF

          # 6. .npmrc
          cat > .npmrc << 'EOF'
          auto-install-peers=true
          strict-peer-dependencies=false
          EOF

          # 7. .env.example
          cat > .env.example << 'EOF'
          NEXT_PUBLIC_APP_URL="http://localhost:3000"
          EOF

          # 8. Core Package (packages/core)
          cat > packages/core/package.json << 'EOF'
          {
            "name": "@repo/core",
            "version": "0.0.0",
            "private": true,
            "main": "./src/index.ts",
            "types": "./src/index.ts",
            "scripts": {
              "typecheck": "tsc --noEmit",
              "lint": "echo 'no lint'"
            },
            "devDependencies": {
              "typescript": "^5.7.2"
            }
          }
          EOF

          cat > packages/core/tsconfig.json << 'EOF'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "noEmit": true
            },
            "include": ["src/**/*.ts"]
          }
          EOF

          cat > packages/core/src/index.ts << 'EOF'
          export interface IApp {
            id: string;
            name: string;
            slug: string;
          }

          export interface IUser {
            id: string;
            email: string;
          }
          EOF

          # 9. UI Package (packages/ui)
          cat > packages/ui/package.json << 'EOF'
          {
            "name": "@repo/ui",
            "version": "0.0.0",
            "private": true,
            "main": "./src/index.ts",
            "types": "./src/index.ts",
            "scripts": {
              "typecheck": "tsc --noEmit",
              "lint": "echo 'no lint'"
            },
            "dependencies": {
              "react": "^19.0.0"
            },
            "devDependencies": {
              "@types/react": "^19.0.2",
              "typescript": "^5.7.2"
            }
          }
          EOF

          cat > packages/ui/tsconfig.json << 'EOF'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "jsx": "react-jsx",
              "noEmit": true
            },
            "include": ["src/**/*.ts", "src/**/*.tsx"]
          }
          EOF

          cat > packages/ui/src/index.ts << 'EOF'
          export * from "./button";
          EOF

          cat > packages/ui/src/button.tsx << 'EOF'
          import type { ButtonHTMLAttributes } from "react";

          export function Button(props: ButtonHTMLAttributes<HTMLButtonElement>) {
            return (
              <button
                {...props}
                style={{
                  padding: "8px 16px",
                  backgroundColor: "#2563eb",
                  color: "white",
                  border: "none",
                  borderRadius: "6px",
                  cursor: "pointer",
                  ...props.style,
                }}
              />
            );
          }
          EOF

          # 10. Builder App (apps/builder)
          cat > apps/builder/package.json << 'EOF'
          {
            "name": "@repo/builder",
            "version": "0.0.0",
            "private": true,
            "scripts": {
              "dev": "next dev -p 3000",
              "build": "next build",
              "start": "next start -p 3000",
              "lint": "next lint",
              "typecheck": "tsc --noEmit"
            },
            "dependencies": {
              "@repo/core": "workspace:*",
              "@repo/ui": "workspace:*",
              "next": "^15.1.3",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            },
            "devDependencies": {
              "@types/node": "^22.10.2",
              "@types/react": "^19.0.2",
              "@types/react-dom": "^19.0.2",
              "typescript": "^5.7.2"
            }
          }
          EOF

          cat > apps/builder/next.config.ts << 'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            transpilePackages: ["@repo/core", "@repo/ui"],
          };

          export default nextConfig;
          EOF

          cat > apps/builder/tsconfig.json << 'EOF'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "plugins": [{ "name": "next" }],
              "noEmit": true,
              "allowJs": true,
              "incremental": true,
              "paths": {
                "@/*": ["./*"]
              }
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
            "exclude": ["node_modules"]
          }
          EOF

          cat > apps/builder/app/globals.css << 'EOF'
          body { margin: 0; font-family: system-ui, sans-serif; }
          EOF

          cat > apps/builder/app/layout.tsx << 'EOF'
          import "./globals.css";

          export const metadata = { title: "App Builder" };

          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (
              <html lang="en">
                <body>{children}</body>
              </html>
            );
          }
          EOF

          cat > apps/builder/app/page.tsx << 'EOF'
          import { Button } from "@repo/ui";
          import type { IApp } from "@repo/core";

          export default function Home() {
            const demoApp: IApp = { id: "1", name: "Demo", slug: "demo" };
            
            return (
              <main style={{ padding: "40px" }}>
                <h1>Builder Dashboard</h1>
                <p>App Name: {demoApp.name}</p>
                <Button onClick={() => alert("Clicked!")}>Click Me</Button>
              </main>
            );
          }
          EOF

          # 11. Client App (apps/client)
          cat > apps/client/package.json << 'EOF'
          {
            "name": "@repo/client",
            "version": "0.0.0",
            "private": true,
            "scripts": {
              "dev": "next dev -p 3001",
              "build": "next build",
              "start": "next start -p 3001",
              "lint": "next lint",
              "typecheck": "tsc --noEmit"
            },
            "dependencies": {
              "@repo/core": "workspace:*",
              "next": "^15.1.3",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            },
            "devDependencies": {
              "@types/node": "^22.10.2",
              "@types/react": "^19.0.2",
              "@types/react-dom": "^19.0.2",
              "typescript": "^5.7.2"
            }
          }
          EOF

          cat > apps/client/next.config.ts << 'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            transpilePackages: ["@repo/core"],
          };

          export default nextConfig;
          EOF

          cat > apps/client/tsconfig.json << 'EOF'
          {
            "extends": "../../tsconfig.base.json",
            "compilerOptions": {
              "plugins": [{ "name": "next" }],
              "noEmit": true,
              "paths": { "@/*": ["./*"] }
            },
            "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"]
          }
          EOF

          cat > apps/client/app/layout.tsx << 'EOF'
          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (
              <html lang="en">
                <body>{children}</body>
              </html>
            );
          }
          EOF

          cat > apps/client/app/page.tsx << 'EOF'
          export default function ClientHome() {
            return (
              <main style={{ padding: "40px" }}>
                <h1>Runtime Client</h1>
                <p>This is where generated apps run.</p>
              </main>
            );
          }
          EOF

          # 12. CI Workflow
          cat > .github/workflows/ci.yml << 'EOF'
          name: CI

          on:
            push:
              branches: ["main"]
            pull_request:

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 9
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: "pnpm"
                - run: pnpm install --frozen-lockfile
                - run: pnpm typecheck
                - run: pnpm build
          EOF

          echo "✅ All files generated successfully."

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: wipe old structure and scaffold complete monorepo [skip ci]" || echo "No changes to commit"
          git push
